
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mosconi Warehouse</title>

    <!-- Load stylesheet and JavaScript -->
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>

<body>
    <!-- Application header -->
    <header>
        <h1>Mosconi Warehouse</h1>
        <p>Inventory Management System</p>
    </header>

    <main>
        <!-- Products table -->
        <section>
            <h2 style="text-align: center">Products</h2>

            <table id="products-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Quantity</th>
                        <th>Price (€)</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="products-list">
                    <!-- Products will be loaded here -->
                </tbody>
            </table>
        </section>

        <!-- Product creation and editing form -->
        <section>
            <h2>Add Product</h2>

            <form id="product-form">
                <!-- Product name -->
                <label for="name">Product name</label>
                <input type="text" id="name" maxlength="255" required>

                <!-- Product quantity -->
                <label for="quantity">Quantity</label>
                <input type="number" id="quantity" min="0" step="1" required>

                <!-- Product price -->
                <label for="price">Price (€)</label>
                <input type="number" id="price" min="0" max="99999999.99" step="0.01" required>

                <!-- Form action buttons -->
                <button type="submit">Add Product</button>
                <button type="button" id="cancel-button" hidden>Cancel</button>
            </form>
        </section>
    </main>
</body>
</html>
